server.port=8080
spring.application.name=petplace

# The web site lives in ../frontend (run the app from the backend folder).
spring.web.resources.static-locations=file:../frontend/,file:./frontend/
spring.web.resources.cache.period=0

# Catalogue (breeds, categories, products, puppies) is shared with the front end.
petplace.catalog-path=../frontend/data/catalog.json

# Allow the front end to call the API when it is served from another local port.
petplace.cors-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000
