<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter — PetPlace</title>
  <meta name="description" content="PetPlace — where every pet feels at home.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="newsletter">
  <header id="site-header"></header>
  <main class="photo-page">
    <img class="bg" src="images/newsletter-bg.jpg" alt="" onerror="this.remove()">
    <section class="form-card">
      <h1>PetsPlace Newsletter</h1>
      <form id="newsletter-form" novalidate>
        <div class="field"><label for="firstName">Full Name</label><input id="firstName" name="firstName" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="lastName">Last Name</label><input id="lastName" name="lastName" type="text" autocomplete="family-name" required></div>
        <div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="country">Country</label><input id="country" name="country" type="text" autocomplete="country-name"></div>
        <button class="subscribe-btn" type="submit">SUBSCRIBE</button>
        <p class="form-message center" id="form-message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="js/catalog-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
