<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — PetPlace</title>
  <meta name="description" content="PetPlace — where every pet feels at home.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="signin">
  <main class="auth">
    <img class="bg" src="images/auth-bg.jpg" alt="" onerror="this.remove()">
    <div class="auth-box">
      <h1>Welcome Back</h1>
      <form id="auth-form" novalidate>
        <div class="field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <div class="auth-row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="contact.html">Forgot Password</a>
        </div>
        <button class="btn btn-center" type="submit">Sign In</button>
        <p class="form-message" id="form-message" role="alert"></p>
      </form>
      <div class="divider">or continue with</div>
      <div class="social">
        <button class="btn" type="button" data-social="Google">Google</button>
        <button class="btn" type="button" data-social="Apple">&#63743; Apple</button>
      </div>
      <p class="auth-foot">Don&rsquo;t have an account? <a href="signup.html">Sign Up</a><br><a href="home.html">Continue as guest</a></p>
    </div>
  </main>
  <script src="js/catalog-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
